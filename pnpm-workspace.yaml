packages:
  - "packages/*"
  - "services/*"
  - "apps/*"

# esbuild ships a platform binary and needs its postinstall to run. Declared explicitly so a
# fresh clone installs without an interactive prompt.
allowBuilds:
  # Platform binaries and native addons that need their postinstall to run. Declared so a fresh
  # clone installs non-interactively; nothing here executes at request time.
  esbuild: true # bundler binary (vitest)
  sharp: true # next/image resizing
  keccak: false # wagmi pulls it in; the pure-JS fallback is fine and avoids a native build
  bufferutil: false # optional ws speedup, not required
  utf-8-validate: false # optional ws speedup, not required
  workerd: true # Cloudflare Workers runtime — wrangler/OpenNext build + deploy. Local tooling, not request-time.
