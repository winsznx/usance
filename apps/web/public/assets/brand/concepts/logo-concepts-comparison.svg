<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590">
<defs></defs>
<rect width="940" height="590" fill="#f7f7f5"/>
<rect x="40" y="40" width="260" height="230" rx="24" fill="#ffffff" stroke="#edece7"/><g transform="translate(138,70)">
<g fill="#1b0624">
  <!-- asset / legal record -->
  <path d="M7 10H43V21H34V43H43V54H7Z"/>
  <!-- admitted usable capacity, extracted from the record -->
  <rect x="48" y="22" width="9" height="20" rx="1.5"/>
</g></g><text x="60" y="170" font-family="Inter, sans-serif" font-size="16" fill="#1b0624">01-capacity-cut</text><text x="60" y="200" font-family="Inter, sans-serif" font-size="12" fill="#898683">score 76/80</text><text x="60" y="224" font-family="Inter, sans-serif" font-size="10" fill="#444444">A verified portion of an asset</text><text x="60" y="239" font-family="Inter, sans-serif" font-size="10" fill="#444444">is extracted into usable</text><text x="60" y="254" font-family="Inter, sans-serif" font-size="10" fill="#444444">capital. This directly</text><rect x="340" y="40" width="260" height="230" rx="24" fill="#ffffff" stroke="#edece7"/><g transform="translate(438,70)">
<g fill="none" stroke="#1b0624" stroke-width="6" stroke-linejoin="miter">
  <!-- outer registered asset -->
  <rect x="9" y="9" width="46" height="46" rx="2"/>
  <!-- admitted region -->
  <path d="M22 22H42V42H22Z"/>
  <!-- registration datum -->
  <path d="M42 32H57"/>
</g></g><text x="360" y="170" font-family="Inter, sans-serif" font-size="16" fill="#1b0624">02-registered-capacity</text><text x="360" y="200" font-family="Inter, sans-serif" font-size="12" fill="#898683">score 67/80</text><text x="360" y="224" font-family="Inter, sans-serif" font-size="10" fill="#444444">A registered financial record</text><text x="360" y="239" font-family="Inter, sans-serif" font-size="10" fill="#444444">contains an admitted inner</text><text x="360" y="254" font-family="Inter, sans-serif" font-size="10" fill="#444444">region. Precise, institutional,</text><rect x="640" y="40" width="260" height="230" rx="24" fill="#ffffff" stroke="#edece7"/><g transform="translate(738,70)">
<g fill="none" stroke="#1b0624" stroke-width="6" stroke-linejoin="miter">
  <!-- evidence record -->
  <path d="M10 9H40L54 23V55H10Z"/>
  <path d="M40 9V23H54"/>
  <!-- capacity fold -->
  <path d="M20 37H44"/>
</g>
<rect x="39" y="32" width="15" height="10" fill="#1b0624"/></g><text x="660" y="170" font-family="Inter, sans-serif" font-size="16" fill="#1b0624">03-passport-fold</text><text x="660" y="200" font-family="Inter, sans-serif" font-size="12" fill="#898683">score 62/80</text><text x="660" y="224" font-family="Inter, sans-serif" font-size="10" fill="#444444">A legal record folds into a</text><text x="660" y="239" font-family="Inter, sans-serif" font-size="10" fill="#444444">capital block. Strong Passport</text><text x="660" y="254" font-family="Inter, sans-serif" font-size="10" fill="#444444">association, but risks reading</text><rect x="40" y="310" width="260" height="230" rx="24" fill="#ffffff" stroke="#edece7"/><g transform="translate(138,340)">
<g fill="#1b0624">
  <!-- stacked asset -->
  <rect x="8" y="10" width="38" height="10" rx="2"/>
  <rect x="8" y="27" width="38" height="10" rx="2"/>
  <rect x="8" y="44" width="38" height="10" rx="2"/>
  <!-- one admitted slice moved into usable capacity -->
  <rect x="50" y="27" width="8" height="10" rx="2"/>
</g></g><text x="60" y="440" font-family="Inter, sans-serif" font-size="16" fill="#1b0624">04-admitted-slice</text><text x="60" y="470" font-family="Inter, sans-serif" font-size="12" fill="#898683">score 71/80</text><text x="60" y="494" font-family="Inter, sans-serif" font-size="10" fill="#444444">Only one slice of a larger asset</text><text x="60" y="509" font-family="Inter, sans-serif" font-size="10" fill="#444444">stack becomes usable. Strong for</text><text x="60" y="524" font-family="Inter, sans-serif" font-size="10" fill="#444444">haircuts/recognized collateral,</text><rect x="340" y="310" width="260" height="230" rx="24" fill="#ffffff" stroke="#edece7"/><g transform="translate(438,340)">
<g fill="none" stroke="#1b0624" stroke-width="6" stroke-linejoin="miter">
  <!-- two obligations / domains -->
  <path d="M8 14H25V50H8"/>
  <path d="M56 14H39V50H56"/>
  <!-- one authoritative clearing register -->
  <path d="M25 23H39M25 41H39"/>
</g>
<rect x="28" y="27" width="8" height="10" fill="#1b0624"/></g><text x="360" y="440" font-family="Inter, sans-serif" font-size="16" fill="#1b0624">05-clearing-register</text><text x="360" y="470" font-family="Inter, sans-serif" font-size="12" fill="#898683">score 67/80</text><text x="360" y="494" font-family="Inter, sans-serif" font-size="10" fill="#444444">Two domains share one clearing</text><text x="360" y="509" font-family="Inter, sans-serif" font-size="10" fill="#444444">record. Strong clearing meaning,</text><text x="360" y="524" font-family="Inter, sans-serif" font-size="10" fill="#444444">but the transformation from</text><rect x="640" y="310" width="260" height="230" rx="24" fill="#ffffff" stroke="#edece7"/><g transform="translate(738,340)">
<g fill="#1b0624">
  <!-- evidence record -->
  <rect x="7" y="12" width="22" height="40" rx="2"/>
  <!-- capital block -->
  <rect x="40" y="20" width="17" height="24" rx="2"/>
  <!-- shared registration coordinate -->
  <rect x="27" y="28" width="15" height="8" rx="1"/>
</g></g><text x="660" y="440" font-family="Inter, sans-serif" font-size="16" fill="#1b0624">06-evidence-capital-pair</text><text x="660" y="470" font-family="Inter, sans-serif" font-size="12" fill="#898683">score 67/80</text><text x="660" y="494" font-family="Inter, sans-serif" font-size="10" fill="#444444">Evidence and capital are</text><text x="660" y="509" font-family="Inter, sans-serif" font-size="10" fill="#444444">separate objects linked by one</text><text x="660" y="524" font-family="Inter, sans-serif" font-size="10" fill="#444444">registration coordinate. Clear</text>
</svg>